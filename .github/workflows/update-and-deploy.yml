name: Update Kids Activities & Deploy to GitHub Pages

on:
  schedule:
    # 每週一與週四 04:00 台灣時間 (UTC+8) = 每週日與週三 20:00 UTC
    - cron: "0 20 * * 0,3"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-data"
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Taiwan kids activities scraper
        run: python3 scripts/update_data.py

      - name: Validate data quality harness
        run: python3 tools/check_data.py

      - name: Commit updated data if changed
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/activities.json data/sync_meta.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): auto-update Taiwan kids activities ($(date +'%Y-%m-%d'))"
            git push
          else
            echo "No data changes to commit."
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
